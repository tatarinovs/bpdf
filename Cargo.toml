[package]
name = "bpdf"
version = "0.1.0"
edition = "2024"
description = "Rust prototype for loss-conscious PDF and image processing"
license = "MIT"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.4", features = ["derive"] }
glob = "0.3.3"
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
lopdf = "0.44.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.23.0"
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
ureq = { version = "3.3.0", default-features = false, features = [
    "json",
    "rustls",
    "socks-proxy",
] }

[profile.release]
strip = true
lto = "fat"
opt-level = "z"
codegen-units = 1
