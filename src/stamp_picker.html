<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bpdf — печать</title>
<style>
  :root {
    --bg: #e9ebef; --panel: #ffffff; --text: #1d2330; --muted: #6b7385;
    --line: #d5d9e1; --accent: #1239b8; --accent-text: #ffffff; --danger: #c62f3c;
    --sheet-shadow: 0 2px 12px rgba(20, 30, 60, .18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1e24; --panel: #252931; --text: #e6e9ef; --muted: #9aa2b2;
      --line: #3a404c; --accent: #5b82ff; --accent-text: #0d1220; --danger: #ff6b76;
      --sheet-shadow: 0 2px 14px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 132px 1fr;
    grid-template-areas: "bar bar" "thumbs main" "hint hint";
    background: var(--bg); color: var(--text);
    font: 14px/1.4 "Segoe UI", system-ui, sans-serif; user-select: none;
  }
  header {
    grid-area: bar; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header .file { font-weight: 600; max-width: 32ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .spacer { flex: 1; }
  header .size { color: var(--muted); min-width: 11ch; text-align: right; font-variant-numeric: tabular-nums; }
  button {
    font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 11px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
  .pager { display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
  #thumbs {
    grid-area: thumbs; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px;
    background: var(--panel); border-right: 1px solid var(--line);
  }
  .thumb { position: relative; cursor: pointer; border: 2px solid transparent; border-radius: 4px; padding: 2px; }
  .thumb.current { border-color: var(--accent); }
  .thumb img { display: block; width: 100%; background: #fff; box-shadow: var(--sheet-shadow); }
  .thumb .num { position: absolute; left: 6px; bottom: 6px; font-size: 11px; color: #333; background: rgba(255,255,255,.85); padding: 0 4px; border-radius: 3px; }
  .thumb .badge {
    position: absolute; right: 4px; top: 4px; min-width: 20px; height: 20px; border-radius: 10px;
    background: var(--accent); color: var(--accent-text); font-size: 12px; font-weight: 700;
    display: none; align-items: center; justify-content: center; padding: 0 5px;
  }
  .thumb.stamped .badge { display: flex; }
  main { grid-area: main; position: relative; overflow: hidden; display: grid; place-items: center; }
  #sheet { position: relative; background: #fff; box-shadow: var(--sheet-shadow); }
  #sheet > img.page { display: block; width: 100%; height: 100%; pointer-events: none; }
  .stamp { position: absolute; cursor: move; touch-action: none; }
  .stamp img { display: block; width: 100%; height: 100%; pointer-events: none; }
  .stamp.selected { outline: 1.5px dashed var(--accent); outline-offset: 1px; }
  .handle { position: absolute; width: 12px; height: 12px; background: var(--accent); border: 2px solid #fff; border-radius: 2px; display: none; }
  .stamp.selected .handle { display: block; }
  .handle.nw { left: -7px; top: -7px; cursor: nwse-resize; }
  .handle.ne { right: -7px; top: -7px; cursor: nesw-resize; }
  .handle.sw { left: -7px; bottom: -7px; cursor: nesw-resize; }
  .handle.se { right: -7px; bottom: -7px; cursor: nwse-resize; }
  #loading { position: absolute; color: var(--muted); }
  footer { grid-area: hint; padding: 6px 12px; color: var(--muted); font-size: 12.5px; background: var(--panel); border-top: 1px solid var(--line); }
  #done {
    position: fixed; inset: 0; display: none; place-items: center; background: var(--bg);
    font-size: 18px; text-align: center; z-index: 10;
  }
  #done.show { display: grid; }
  @media (max-width: 700px) {
    body { grid-template-columns: 1fr; grid-template-areas: "bar" "main" "hint"; }
    #thumbs { display: none; }
  }
</style>
</head>
<body>
<header>
  <span class="file" id="file"></span>
  <span class="pager">
    <button id="prev" title="Предыдущая страница (PgUp)">◀</button>
    <span id="pageLabel">–</span>
    <button id="next" title="Следующая страница (PgDn)">▶</button>
  </span>
  <button id="add" title="Добавить печать на эту страницу (Insert)">＋ На страницу</button>
  <button id="all" title="Поставить такую же печать на все страницы без печати">На все страницы</button>
  <button id="remove" class="danger" title="Удалить выбранную печать (Delete)">Удалить</button>
  <span class="spacer"></span>
  <span class="size" id="size"></span>
  <button id="cancel" title="Закрыть без изменений (Esc)">Отмена</button>
  <button id="apply" class="primary" title="Поставить печати (Enter)">Применить</button>
</header>
<nav id="thumbs"></nav>
<main id="main"><span id="loading">Загрузка…</span><div id="sheet" hidden><img class="page" id="pageImg" alt=""></div></main>
<footer>Перетаскивайте печать мышью · колесо или уголки — размер (Shift — точнее) · двойной клик — поставить печать в это место · стрелки — сдвиг · Del — удалить · Enter — применить · Esc — отмена</footer>
<div id="done"><div id="doneText">Готово. Окно можно закрыть.</div></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const MM_PER_PT = 25.4 / 72;
let info = null;
let stamps = [];          // {page (0-based), x, y, w} — fractions of the displayed page, top-left origin
let current = 0;
let selected = null;
let physicalWidth = null; // last used stamp width in "paper" points, carried between pages
let finished = false;

const pageInfo = (index) => info.pages[index];
// Stamp height as a fraction of the page height, from its width fraction.
const heightOf = (stamp) => {
  const page = pageInfo(stamp.page);
  return stamp.w * (page.width / page.height) / info.aspect;
};
const widthPt = (stamp) => stamp.w * pageInfo(stamp.page).width;

async function post(path, body) {
  return fetch(path, { method: "POST", body: body === undefined ? undefined : JSON.stringify(body) });
}

async function init() {
  info = await (await fetch("info")).json();
  $("file").textContent = info.file || "";
  $("file").title = info.file || "";
  document.title = `Печать — ${info.file || "bpdf"}`;
  stamps = info.stamps.map((s) => ({ page: s.page - 1, x: s.x, y: s.y, w: s.w }));
  if (stamps.length) {
    physicalWidth = widthPt(stamps[0]) / pageInfo(stamps[0].page).paper;
    current = stamps[0].page;
  }
  buildThumbs();
  showPage(current, true);
  setInterval(() => { if (!finished) post("ping").catch(() => {}); }, 5000);
}

function buildThumbs() {
  const nav = $("thumbs");
  info.pages.forEach((_, index) => {
    const item = document.createElement("div");
    item.className = "thumb";
    item.innerHTML = `<img alt="" loading="lazy"><span class="num">${index + 1}</span><span class="badge"></span>`;
    item.addEventListener("click", () => showPage(index));
    nav.appendChild(item);
  });
}

function loadThumbs() {
  document.querySelectorAll(".thumb img").forEach((img, index) => {
    if (!img.src) img.src = `page/${index + 1}`;
  });
}

function refreshThumbs() {
  document.querySelectorAll(".thumb").forEach((item, index) => {
    const count = stamps.filter((s) => s.page === index).length;
    item.classList.toggle("current", index === current);
    item.classList.toggle("stamped", count > 0);
    item.querySelector(".badge").textContent = count;
  });
  const active = document.querySelectorAll(".thumb")[current];
  if (active) active.scrollIntoView({ block: "nearest" });
}

function showPage(index, first) {
  if (index < 0 || index >= info.pages.length) return;
  current = index;
  if (selected && selected.page !== index) selected = null;
  if (!selected) selected = stamps.find((s) => s.page === index) || null;
  const img = $("pageImg");
  img.onload = () => {
    $("loading").hidden = true;
    $("sheet").hidden = false;
    layout();
    if (first) loadThumbs();
  };
  img.onerror = () => { $("loading").hidden = false; $("loading").textContent = "Не удалось отрисовать страницу"; };
  img.src = `page/${index + 1}`;
  $("pageLabel").textContent = `${index + 1} / ${info.pages.length}`;
  $("prev").disabled = index === 0;
  $("next").disabled = index === info.pages.length - 1;
  layout();
  refreshThumbs();
}

function sheetSize() {
  const page = pageInfo(current);
  const main = $("main");
  const availableWidth = Math.max(main.clientWidth - 32, 50);
  const availableHeight = Math.max(main.clientHeight - 32, 50);
  const scale = Math.min(availableWidth / page.width, availableHeight / page.height);
  return { width: page.width * scale, height: page.height * scale };
}

function layout() {
  if (!info) return;
  const sheet = $("sheet");
  const { width, height } = sheetSize();
  sheet.style.width = `${width}px`;
  sheet.style.height = `${height}px`;
  sheet.querySelectorAll(".stamp").forEach((el) => el.remove());
  for (const stamp of stamps.filter((s) => s.page === current)) {
    const el = document.createElement("div");
    el.className = "stamp" + (stamp === selected ? " selected" : "");
    el.style.left = `${stamp.x * width}px`;
    el.style.top = `${stamp.y * height}px`;
    el.style.width = `${stamp.w * width}px`;
    el.style.height = `${heightOf(stamp) * height}px`;
    el.innerHTML = `<img src="stamp" alt="" draggable="false">` +
      ["nw", "ne", "sw", "se"].map((c) => `<span class="handle ${c}" data-corner="${c}"></span>`).join("");
    const picture = el.querySelector("img");
    picture.style.opacity = info.opacity;
    picture.style.mixBlendMode = info.blend;
    el.addEventListener("pointerdown", (event) => startDrag(event, stamp, el));
    sheet.appendChild(el);
  }
  updateControls();
}

function updateControls() {
  $("remove").disabled = !selected;
  $("all").disabled = !(selected || stamps.length) || info.pages.length < 2;
  $("apply").disabled = stamps.length === 0;
  if (selected) {
    const paper = pageInfo(selected.page).paper;
    const w = widthPt(selected) / paper * MM_PER_PT;
    const h = heightOf(selected) * pageInfo(selected.page).height / paper * MM_PER_PT;
    $("size").textContent = `${w.toFixed(0)} × ${h.toFixed(0)} мм`;
  } else {
    $("size").textContent = stamps.length ? `печатей: ${stamps.length}` : "нет печатей";
  }
}

function select(stamp) {
  selected = stamp;
  if (stamp) physicalWidth = widthPt(stamp) / pageInfo(stamp.page).paper;
  layout();
}

// Selection without re-rendering, so a drag keeps its element.
function markSelected(stamp, el) {
  selected = stamp;
  physicalWidth = widthPt(stamp) / pageInfo(stamp.page).paper;
  document.querySelectorAll(".stamp.selected").forEach((other) => other.classList.remove("selected"));
  el.classList.add("selected");
  updateControls();
}

function startDrag(event, stamp, el) {
  event.preventDefault();
  event.stopPropagation();
  markSelected(stamp, el);
  const target = el;
  target.setPointerCapture(event.pointerId);
  const { width, height } = sheetSize();
  const corner = event.target.dataset ? event.target.dataset.corner : undefined;
  const start = { px: event.clientX, py: event.clientY, x: stamp.x, y: stamp.y, w: stamp.w, h: heightOf(stamp) };
  const move = (e) => {
    const dx = (e.clientX - start.px) / width;
    const dy = (e.clientY - start.py) / height;
    if (!corner) {
      stamp.x = start.x + dx;
      stamp.y = start.y + dy;
    } else {
      // Resize around the opposite corner, keeping the aspect ratio.
      const sign = corner.includes("w") ? -1 : 1;
      const w = Math.max(start.w + sign * dx, 0.02);
      const ratio = w / start.w;
      stamp.w = w;
      if (corner.includes("w")) stamp.x = start.x + start.w - w;
      if (corner.includes("n")) stamp.y = start.y + start.h - start.h * ratio;
    }
    clamp(stamp);
    place(target, stamp);
  };
  const up = () => {
    target.removeEventListener("pointermove", move);
    target.removeEventListener("pointerup", up);
    target.removeEventListener("pointercancel", up);
    markSelected(stamp, target);
  };
  target.addEventListener("pointermove", move);
  target.addEventListener("pointerup", up);
  target.addEventListener("pointercancel", up);
}

function place(el, stamp) {
  const { width, height } = sheetSize();
  el.style.left = `${stamp.x * width}px`;
  el.style.top = `${stamp.y * height}px`;
  el.style.width = `${stamp.w * width}px`;
  el.style.height = `${heightOf(stamp) * height}px`;
  updateControls();
}

// Keep at least a quarter of the stamp on the page.
function clamp(stamp) {
  const w = stamp.w, h = heightOf(stamp);
  stamp.x = Math.min(Math.max(stamp.x, -w * 0.75), 1 - w * 0.25);
  stamp.y = Math.min(Math.max(stamp.y, -h * 0.75), 1 - h * 0.25);
}

function resize(stamp, factor) {
  const h = heightOf(stamp);
  const cx = stamp.x + stamp.w / 2, cy = stamp.y + h / 2;
  stamp.w = Math.min(Math.max(stamp.w * factor, 0.02), 1.5);
  stamp.x = cx - stamp.w / 2;
  stamp.y = cy - heightOf(stamp) / 2;
  clamp(stamp);
  select(stamp);
}

function newStamp(page, centerX, centerY) {
  const info_ = pageInfo(page);
  const widthPoints = (physicalWidth || 120) * info_.paper;
  const stamp = { page, x: 0, y: 0, w: Math.min(widthPoints / info_.width, 0.9) };
  const template = selected || stamps[stamps.length - 1];
  if (centerX === undefined) {
    if (template) {
      stamp.x = template.x; stamp.y = template.y;
    } else {
      stamp.x = 0.9 - stamp.w; stamp.y = 0.9 - heightOf(stamp);
    }
  } else {
    stamp.x = centerX - stamp.w / 2;
    stamp.y = centerY - heightOf(stamp) / 2;
  }
  clamp(stamp);
  stamps.push(stamp);
  return stamp;
}

function removeSelected() {
  if (!selected) return;
  stamps = stamps.filter((s) => s !== selected);
  selected = stamps.find((s) => s.page === current) || null;
  layout();
  refreshThumbs();
}

function stampAllPages() {
  const template = selected || stamps.find((s) => s.page === current) || stamps[stamps.length - 1];
  if (!template) return;
  physicalWidth = widthPt(template) / pageInfo(template.page).paper;
  const previous = selected;
  selected = template;
  info.pages.forEach((_, index) => {
    if (!stamps.some((s) => s.page === index)) newStamp(index);
  });
  selected = previous || template;
  layout();
  refreshThumbs();
}

async function apply() {
  if (finished || !stamps.length) return;
  const body = stamps.map((s) => ({ page: s.page + 1, x: s.x, y: s.y, w: s.w, h: heightOf(s) }));
  const response = await post("apply", body);
  if (!response.ok) {
    alert(await response.text());
    return;
  }
  finish(`Печатей поставлено: ${stamps.length}. Окно можно закрыть.`);
}

async function cancel() {
  if (finished) return;
  await post("cancel").catch(() => {});
  finish("Отменено, файл не изменён. Окно можно закрыть.");
}

function finish(message) {
  finished = true;
  $("doneText").textContent = message;
  $("done").classList.add("show");
  setTimeout(() => window.close(), 300);
}

$("prev").onclick = () => showPage(current - 1);
$("next").onclick = () => showPage(current + 1);
$("add").onclick = () => { select(newStamp(current)); refreshThumbs(); };
$("all").onclick = stampAllPages;
$("remove").onclick = removeSelected;
$("apply").onclick = apply;
$("cancel").onclick = cancel;

$("sheet").addEventListener("pointerdown", (event) => {
  if (event.target.closest(".stamp")) return;
  if (selected) { selected = null; layout(); }
});
$("sheet").addEventListener("dblclick", (event) => {
  if (event.target.closest(".stamp")) return;
  const rect = $("sheet").getBoundingClientRect();
  const stamp = newStamp(current, (event.clientX - rect.left) / rect.width, (event.clientY - rect.top) / rect.height);
  select(stamp);
  refreshThumbs();
});
$("main").addEventListener("wheel", (event) => {
  if (!selected || selected.page !== current) return;
  event.preventDefault();
  const step = event.shiftKey ? 1.01 : 1.05;
  resize(selected, event.deltaY < 0 ? step : 1 / step);
}, { passive: false });

document.addEventListener("keydown", (event) => {
  if (finished) return;
  const { width, height } = sheetSize();
  const nudge = event.shiftKey ? 10 : 1;
  const moves = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (event.key === "Enter") { event.preventDefault(); apply(); }
  else if (event.key === "Escape") { event.preventDefault(); cancel(); }
  else if (event.key === "Delete" || event.key === "Backspace") { event.preventDefault(); removeSelected(); }
  else if (event.key === "Insert") { event.preventDefault(); select(newStamp(current)); refreshThumbs(); }
  else if (event.key === "PageUp") { event.preventDefault(); showPage(current - 1); }
  else if (event.key === "PageDown") { event.preventDefault(); showPage(current + 1); }
  else if (event.key === "+" || event.key === "=") { if (selected) resize(selected, 1.05); }
  else if (event.key === "-") { if (selected) resize(selected, 1 / 1.05); }
  else if (moves[event.key]) {
    event.preventDefault();
    const [dx, dy] = moves[event.key];
    if (selected && selected.page === current) {
      selected.x += dx * nudge / width;
      selected.y += dy * nudge / height;
      clamp(selected);
      layout();
    } else if (dx) {
      showPage(current + dx);
    }
  }
});

window.addEventListener("resize", layout);
// Closing the window tells bpdf to stop waiting; a reload re-registers within seconds.
window.addEventListener("pagehide", () => { if (!finished) navigator.sendBeacon("closed"); });
init().catch((error) => { $("loading").textContent = `Ошибка: ${error}`; });
</script>
</body>
</html>
