; ==============================================================================
; bpdf_shell_en.ini — English Windows context menu configuration for bpdf
; ==============================================================================
; The extension reads bpdf_shell.ini. To get the English menu, copy this file
; over bpdf_shell.ini (or rename it).
;
; You can edit item titles, commands, flags and icons.
; Changes take effect as soon as the file is saved (no need to rebuild the DLL).
;
; Menu item format:
;   itemN = title: Item title | cmd: command and options | icon: icon_number | gui: mode
;
; Menu separator:
;   itemN = ---
;
; Fields:
;   title: Text shown in the context menu
;   cmd:   Command and options for bpdf.exe.
;          Placeholders (taken from the first selected file):
;            {file}    — full path of the selected file
;            {dir}     — folder of the selected file (a selected folder itself)
;            {name}    — file name without extension
;            {ext}     — file extension (without the dot)
;            {exe_dir} — folder that holds bpdf.exe
;            {ask:Prompt:Default} — input dialog for a value (angle, size, text, ...);
;                                   placeholders work in the default: {ask:Name:{name}_new.pdf}
;                                   the prompt ends at the first colon
;            {ask_pass:Prompt}    — password dialog with masked input;
;                                   after --password / --owner-password of protect
;                                   and unlock the password reaches bpdf through the
;                                   environment, not the command line
;          Values are escaped automatically: spaces and quotes in paths and answers
;          do not break the command, inside "..." or without quotes.
;          If cmd has no {file}:
;            - for a single selection the file path is appended at the end
;            - for a multiple selection @"path_to_list.txt" is passed
;   icon:  Icon number in bpdf.exe resources:
;            0  - bpdf logo
;            1  - merge
;            2  - OCR (Groq)
;            3  - strip metadata
;            4  - split pages
;            5  - extract pages
;            6  - properties and info
;            7  - rotate pages
;            8  - resize pages
;            9  - extract text
;            11 - stamp
;            12 - optimize and compress
;            13 - metadata
;            14 - convert to JPEG
;            15 - page numbers
;            16 - watermark
;            17 - local Windows OCR (ocr-inplace)
;            18 - protect with password
;            19 - unlock
;   gui:   Progress window mode:
;            auto (default) — the window appears only if the operation takes longer than
;                             half a second and closes right after success; it stays
;                             open on errors or warnings (Warning:)
;            info           — for reports (no running progress bar, does not close)
;            keep           — keep the window open even after success
; ==============================================================================

[menu.single.pdf]
item1  = title: Optimize PDF (compress) | cmd: optimize -i | icon: 12
item2  = title: Compress to target size... | cmd: optimize --max-size {ask:Maximum size (e.g. 5MB, 500KB):2MB} -i | icon: 12
item3  = ---
item4  = title: OCR text into PDF (Windows OCR) | cmd: ocr --engine windows -i | icon: 17
item5  = title: OCR text to Markdown (Windows OCR) | cmd: ocr --engine windows | icon: 17
item6  = title: OCR text to Markdown (Groq OCR) | cmd: ocr | icon: 2
item7  = title: Extract text to TXT | cmd: text -o "{dir}\{name}.txt" | icon: 9
item8  = ---
item9  = title: Split PDF into pages | cmd: split | icon: 4
item10 = title: Extract pages... | cmd: extract "{file}" {ask:Page numbers (e.g. 1-5, 8, even, odd, reverse):1} -o "{dir}\{name}_extracted.pdf" | icon: 5
item11 = title: Rotate pages... | cmd: rotate -a {ask:Rotation angle (90, 180, 270, portrait):90} -i | icon: 7
item12 = title: Fit to page size... | cmd: resize --size {ask:Page size (A4, A3, A5, Letter):A4} -i | icon: 8
item13 = title: Number pages... | cmd: number --format "{ask:Number format ({n}, {n}/{total}):{n}}" --position {ask:Position (bc-bottom center, br-bottom right, tc, tr):bc} -i | icon: 15
item14 = title: Add watermark... | cmd: watermark "{file}" "{ask:Watermark text:COPY}" --angle 45 --opacity 0.25 -i | icon: 16
item15 = title: Apply stamp | cmd: stamp "{file}" "{exe_dir}\stamp.png" --pick --blend multiply --scale 1 -i | icon: 11
item16 = ---
item17 = title: Protect with password... | cmd: protect --password "{ask_pass:Password to open the PDF:}" -i | icon: 18
item18 = title: Remove protection / password... | cmd: unlock --password "{ask_pass:Password (or leave empty):}" -i | icon: 19
item19 = title: Remove metadata | cmd: strip -i | icon: 3
item20 = ---
item21 = title: Convert to JPEG | cmd: convert | icon: 14
item22 = title: PDF info | cmd: info | icon: 6 | gui: info

