; ==============================================================================
; bpdf_shell.ini — Конфигурация контекстного меню Windows для bpdf
; ==============================================================================
; Вы можете редактировать названия пунктов, команды, флаги и иконки.
; Изменения вступают в силу сразу при сохранении файла (без перекомпиляции DLL).
;
; Формат пункта меню:
;   itemN = title: Название пункта | cmd: команда и параметры | icon: номер_иконки | gui: режим
;
; Разделитель меню:
;   itemN = ---
;
; Доступные поля:
;   title: Текст, отображаемый в контекстном меню
;   cmd:   Команда и параметры для bpdf.exe.
;          Поддерживаются подстановки (для одиночных файлов):
;            {file}    — полный путь к выбранному файлу (автоматически квотируется)
;            {dir}     — папка с выбранным файлом
;            {name}    — имя файла без расширения
;            {ext}     — расширение файла (без точки)
;            {exe_dir} — папка, где находится bpdf.exe
;            {ask:Подсказка:Дефолт} — диалог ввода параметра (угол, размер, текст и т.д.)
;            {ask_pass:Подсказка}   — диалог ввода пароля с маскировкой звёздочками
;          Если {file} не указан в cmd:
;            - при одиночном выборе путь к файлу автоматически добавляется в конец
;            - при множественном выборе автоматически передаётся @"путь_к_манифесту.txt"
;   icon:  Номер иконки из ресурсов bpdf.exe:
;            0  - логотип bpdf
;            1  - объединение (merge)
;            2  - OCR (Groq)
;            3  - очистка метаданных (strip)
;            4  - разрезка страниц (split)
;            5  - извлечение страниц (extract)
;            6  - свойства и информация (info)
;            7  - поворот страниц (rotate)
;            8  - изменение размера страниц (resize)
;            9  - извлечение текста (text)
;            11 - штамп (stamp)
;            12 - оптимизация и сжатие (optimize)
;            13 - метаданные (metadata)
;            14 - конвертация в JPEG (convert)
;            15 - нумерация страниц (number)
;            16 - водяной знак (watermark)
;            17 - локальный OCR Windows (ocr-inplace)
;            18 - защита паролем (protect)
;            19 - снятие защиты (unlock)
;   gui:   Режим графического окна:
;            auto (по умолчанию) — показывает прогресс, при успехе автоматически закрывается
;            info                — для просмотра отчётов (без бегающего прогресс-бара, не закрывается)
;            keep                — не закрывать окно даже при успешном завершении
;            none                — не показывать окно (для команд со своим интерфейсом в браузере)
; ==============================================================================

[menu.single.pdf]
item1  = title: Оптимизировать PDF (сжатие) | cmd: optimize -i | icon: 12
item2  = title: Сжать до целевого размера... | cmd: optimize --max-size {ask:Максимальный размер (например 5MB, 500KB):2MB} -i | icon: 12
item3  = ---
item4  = title: Распознать текст в PDF (Windows OCR) | cmd: ocr --engine windows -i | icon: 17
item5  = title: Распознать текст в MD (Groq OCR) | cmd: ocr | icon: 2
item6  = title: Извлечь текст в TXT | cmd: text -o "{dir}\{name}.txt" | icon: 9
item7  = ---
item8  = title: Разбить PDF постранично | cmd: split | icon: 4
item9  = title: Извлечь страницы... | cmd: extract "{file}" {ask:Номера страниц (например 1-5, 8, even, odd, reverse):1} -o "{dir}\{name}_extracted.pdf" | icon: 5
item10 = title: Повернуть страницы... | cmd: rotate -a {ask:Угол поворота (90, 180, 270, portrait):90} -i | icon: 7
item11 = title: Подогнать под размер... | cmd: resize --size {ask:Формат страницы (A4, A3, A5, Letter):A4} -i | icon: 8
item12 = title: Пронумеровать страницы... | cmd: number --format "{ask:Формат нумерации ({n}, {n}/{total}):{n}}" --position {ask:Положение (bc-низ центр, br-низ право, tc, tr):bc} -i | icon: 15
item13 = title: Наложить водяной знак... | cmd: watermark "{file}" "{ask:Текст водяного знака:КОПИЯ}" --angle 45 --opacity 0.25 -i | icon: 16
item14 = title: Поставить печать | cmd: stamp "{file}" "{exe_dir}\stamp.png" --pick --blend multiply --scale 1 -i | icon: 11 | gui: none
item15 = ---
item16 = title: Защитить паролем... | cmd: protect --password "{ask_pass:Введите пароль для открытия:}" -i | icon: 18
item17 = title: Снять защиту / пароль... | cmd: unlock --password "{ask_pass:Введите пароль (или оставьте пустым):}" -i | icon: 19
item18 = title: Удалить метаданные | cmd: strip -i | icon: 3
item19 = ---
item20 = title: Конвертировать в JPEG | cmd: convert | icon: 14
item21 = title: Информация о PDF | cmd: info | icon: 6 | gui: info

[menu.single.image]
item1  = title: Конвертировать в PDF (A4) | cmd: merge --optimize --auto-rotate -s A4 | icon: 1
item2  = title: Конвертировать в PDF с выбором формата... | cmd: merge --optimize --auto-rotate -s {ask:Формат страницы (A4, A3, fit, keep):A4} -o "{dir}\{name}.pdf" | icon: 1
item3  = ---
item4  = title: Распознать текст (Windows OCR) | cmd: ocr --engine windows -i | icon: 17
item5  = title: Распознать текст в MD (Groq OCR) | cmd: ocr | icon: 2
item6  = ---
item7  = title: Повернуть изображение... | cmd: rotate -a {ask:Угол поворота (90, 180, 270):90} -i | icon: 7
item8  = title: Изменить размер (сторона в px)... | cmd: resize --long-edge {ask:Макс. размер стороны в пикселях:1920} -i | icon: 8
item9  = title: Сжать JPEG до размера... | cmd: convert --max-size {ask:Макс. размер JPEG (например 500KB, 200KB):300KB} --force | icon: 14
item10 = title: Удалить метаданные (EXIF) | cmd: strip -i | icon: 3
item11 = title: Конвертировать в JPEG | cmd: convert | icon: 14

