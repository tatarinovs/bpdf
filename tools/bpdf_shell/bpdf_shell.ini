item8  = title: Удалить метаданные | cmd: strip -i | icon: 3
item9  = title: Повернуть страницы на 90° | cmd: rotate -a 90 -i | icon: 7
item10 = title: Подогнать под размер A4 | cmd: resize --size A4 -i | icon: 8
