item2  = title: Объединить в PDF с выбором параметров... | cmd: merge --optimize --auto-rotate -s {ask:Формат (A4, A3, fit):A4} -o "{dir}\{ask:Имя PDF файла:merged.pdf}" | icon: 1
item3  = ---
