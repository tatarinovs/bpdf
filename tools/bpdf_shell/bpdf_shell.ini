; ==============================================================================
; bpdf_shell.ini — Конфигурация контекстного меню Windows для bpdf
; ==============================================================================
; Вы можете редактировать названия пунктов, команды, флаги и иконки.
; Изменения вступают в силу сразу при сохранении файла (без перекомпиляции DLL).
;
; Формат пункта меню:
;   itemN = title: Название пункта | cmd: команда и параметры | icon: номер_иконки | gui: режим
;
; Разделитель меню:
;   itemN = ---
;
; Доступные поля:
;   title: Текст, отображаемый в контекстном меню
;   cmd:   Команда и параметры для bpdf.exe.
;          Поддерживаются подстановки (для одиночных файлов):
;            {file}    — полный путь к выбранному файлу
;            {dir}     — папка с выбранным файлом
;            {name}    — имя файла без расширения
;            {ext}     — расширение файла (без точки)
;            {exe_dir} — папка, где находится bpdf.exe
;          Если {file} не указан в cmd:
;            - при одиночном выборе путь к файлу автоматически добавляется в конец
;            - при множественном выборе автоматически передаётся @"путь_к_манифесту.txt"
;   icon:  Номер иконки из ресурсов bpdf.exe:
;            0  - логотип bpdf
;            1  - объединение (merge)
;            2  - OCR (Groq)
;            3  - очистка метаданных (strip)
;            4  - разрезка страниц (split)
;            5  - извлечение страниц (extract)
;            6  - свойства и информация (info)
;            7  - поворот страниц (rotate)
;            8  - изменение размера страниц (resize)
;            9  - извлечение текста (text)
;            11 - штамп (stamp)
;            12 - оптимизация и сжатие (optimize)
;            13 - метаданные (metadata)
;            14 - конвертация в JPEG (convert)
;            15 - нумерация страниц (number)
;            16 - водяной знак (watermark)
;            17 - локальный OCR Windows (ocr-inplace)
;            18 - защита паролем (protect)
;            19 - снятие защиты (unlock)
;   gui:   Режим графического окна:
;            auto (по умолчанию) — показывает прогресс, при успехе автоматически закрывается
;            info                — для просмотра отчётов (без бегающего прогресс-бара, не закрывается)
;            keep                — не закрывать окно даже при успешном завершении
;            none                — не показывать окно (для команд со своим интерфейсом в браузере)
; ==============================================================================

