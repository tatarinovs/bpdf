name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.97
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
      - name: Select Rust 1.97
        run: rustup override set 1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run strict Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --locked

  # The rust-version declared in Cargo.toml must keep building.
  msrv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.89
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Select Rust 1.89
        run: rustup override set 1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Build with the minimum supported Rust
        run: cargo build --all-targets --locked
